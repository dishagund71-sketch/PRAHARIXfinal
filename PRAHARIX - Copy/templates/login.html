<!DOCTYPE html>
<html>

<head>

<title>PRAHARI-X Login</title>

<style>

body{
background:#0b1220;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#1f2937;
padding:30px;
border-radius:12px;
width:350px;
}

input{
width:100%;
padding:10px;
margin-top:10px;
margin-bottom:15px;
}

button{
width:100%;
padding:10px;
background:cyan;
border:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="box">

<h2>🛡 PRAHARI-X Secure Login</h2>

<form method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

{% if error %}
<p style="color:red;">
{{error}}
</p>
{% endif %}

</div>

</body>
</html>
